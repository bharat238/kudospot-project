name: UI verification

on:
  pull_request:
    branches: [main]
    paths:
      - "kudospot-fixed/**"
      - ".github/workflows/ui-verification.yml"
  push:
    branches:
      - main
      - design/vercel-inspired-landing
    paths:
      - "kudospot-fixed/**"
      - ".github/workflows/ui-verification.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kudospot-fixed
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kudospot-fixed/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Check lint
        run: npm run lint
